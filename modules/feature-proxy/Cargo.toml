[package]
name = "mintcat-module-feature-proxy"
version = "0.1.0"
edition = "2021"
description = "Signed Steam acceleration service and daemon-owned lease manager"

[[bin]]
name = "mintcat-proxy"
path = "src/main.rs"

[dependencies]
mintcat-runtime-artifacts = { path = "../../runtime/artifacts" }
mintcat-runtime-jobs = { path = "../../runtime/jobs" }
mintcat-sdk = { path = "../../packages/sdk-rust" }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
dashmap = "6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
http-body-util = "0.1"
bytes = "1"
rustls-pemfile = "2"
pki-types = { package = "rustls-pki-types", version = "1" }
time = "0.3"
sha2 = "0.10"
sha1 = "0.10"

[dev-dependencies]
mintcat-runtime-kernel = { path = "../../runtime/kernel" }
ed25519-dalek = "2"
base64 = "0.22"
tempfile = "3"
target-lexicon = "0.12"
