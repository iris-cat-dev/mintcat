[package]
name = "mintcat"
version = "0.6.0"
description = "Mod Integrate Tool"
authors = ["iriscat"]
edition = "2021"

[workspace]
members = [
    ".",
    "crates/mintcat-integrator-api",
    "crates/mintcat-integrator-core",
    "crates/mintcat-integrator-ffi",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mintcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
target_arch = "x86_64"

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2.8.4", features = ["devtools", "protocol-asset"] }
tauri-plugin-fs = "2.2.1"
tauri-plugin-shell = "2.2.1"
tauri-plugin-os = "2.2.1"
tauri-plugin-log = "2.3.1"
tauri-plugin-dialog = "2.2.1"
tauri-plugin-process = "2.2.1"
tauri-plugin-opener = "2.2.6"
tauri-plugin-updater = "2.7.0"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2.3.0",features = ["sqlite"] }
tauri-plugin-sentry = "0.4"
tauri-plugin-task-queue = { git = "https://github.com/iriscats/tauri-plugin-task-queue" }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"

anyhow = "1"
log = "0.4.27"
tracing = { version = "0.1.41", features = ["attributes"] }

# http
reqwest = { version = "0.12.15", features = ["blocking", "stream", "json", "native-tls"] }
tokio = { version = "1", features = ["full"] }
md5 = "0.7"
sha2 = "0.10"
rand = "0.8"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

# json
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mintcat-integrator-api = { path = "crates/mintcat-integrator-api" }
libloading = "0.8"
keyring = "3"

# integrate
zip = { version = "2.2.0", default-features = false, features = ["aes-crypto", "deflate", "time"] }

# 系统代理检测（未手动设置代理时使用），通过注册表读取兼容所有 Win10 版本
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

